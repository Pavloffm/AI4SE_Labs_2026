<svg xmlns="http://www.w3.org/2000/svg" width="900" height="420" viewBox="0 0 900 420" role="img" aria-labelledby="title desc">
  <title id="title">Task 2 SQL accuracy by prompt approach</title>
  <desc id="desc">Horizontal bar chart: Tree-of-Thought 89.68%, STAR 90.32%, SMART 82.58%.</desc>
  <rect width="900" height="420" rx="18" fill="#f7f8fc"/>
  <text x="40" y="44" font-family="Arial, sans-serif" font-size="23" font-weight="700" fill="#172033">Restaurant SQL accuracy by prompt approach</text>
  <text x="40" y="70" font-family="Arial, sans-serif" font-size="13" fill="#596579">Exact result-row accuracy · n = 155 questions per approach</text>

  <g font-family="Arial, sans-serif" font-size="12" fill="#657188" stroke="#d9deea" stroke-width="1">
    <line x1="205" y1="105" x2="205" y2="335"/>
    <line x1="305" y1="105" x2="305" y2="335"/>
    <line x1="405" y1="105" x2="405" y2="335"/>
    <line x1="505" y1="105" x2="505" y2="335"/>
    <line x1="605" y1="105" x2="605" y2="335"/>
    <line x1="705" y1="105" x2="705" y2="335"/>
    <text x="205" y="355" text-anchor="middle" stroke="none">0%</text>
    <text x="305" y="355" text-anchor="middle" stroke="none">20%</text>
    <text x="405" y="355" text-anchor="middle" stroke="none">40%</text>
    <text x="505" y="355" text-anchor="middle" stroke="none">60%</text>
    <text x="605" y="355" text-anchor="middle" stroke="none">80%</text>
    <text x="705" y="355" text-anchor="middle" stroke="none">100%</text>
  </g>

  <g font-family="Arial, sans-serif" font-size="14" fill="#263249">
    <text x="40" y="151">Tree-of-Thought</text>
    <text x="40" y="226">STAR</text>
    <text x="40" y="301">SMART</text>
  </g>

  <rect x="205" y="126" width="448.4" height="38" rx="8" fill="#5275d8"/>
  <rect x="205" y="201" width="451.6" height="38" rx="8" fill="#15a58b"/>
  <rect x="205" y="276" width="412.9" height="38" rx="8" fill="#e7a33e"/>

  <g font-family="Arial, sans-serif" font-size="14" font-weight="700" fill="#172033">
    <text x="725" y="151">89.68% · 139/155</text>
    <text x="725" y="226">90.32% · 140/155</text>
    <text x="725" y="301">82.58% · 128/155</text>
  </g>

  <text x="40" y="395" font-family="Arial, sans-serif" font-size="11" fill="#788399">Exact evaluator accuracy; 155 questions per approach.</text>
</svg>
